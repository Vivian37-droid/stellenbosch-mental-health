<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign survey results · Stellenbosch</title><style>body{font:16px/1.5 Arial,sans-serif;background:#fff8eb;color:#143842;max-width:850px;margin:40px auto;padding:20px}h1{line-height:1.15}label{display:block;margin:15px 0}input,button{font:inherit;padding:10px}button{background:#087f7c;color:white;border:0;border-radius:5px;cursor:pointer}table{width:100%;border-collapse:collapse;margin:20px 0}th,td{text-align:left;border-bottom:1px solid #d6e2df;padding:10px}#message{white-space:pre-line}fieldset{border:1px solid #d6e2df}</style></head><body><h1>Campaign survey results</h1><p>Enter your reporting key to view the summary. Results describe survey respondents, not all website visitors.</p><form id="report"><label>Month <input type="month" id="month" value="2026-10" required></label><label>Reporting key <input type="password" id="key" autocomplete="off" required></label><button>View results</button> <button type="button" id="download">Download CSV</button></form><p id="message" role="status"></p><div id="results"></div><p><a href="/">Return to the website</a></p><script>
const report=document.getElementById('report'),month=document.getElementById('month'),key=document.getElementById('key'),message=document.getElementById('message'),results=document.getElementById('results');
const labels={service_use:'Used mental health services in Stellenbosch',support_knowledge:'Knows where to get support',helpfulness:'Found the information helpful'};
const options={service_use:{yes:'Yes',no:'No',prefer_not:'Prefer not to say'},support_knowledge:{yes:'Yes',somewhat:'Somewhat',no:'No'},helpfulness:{very:'Very helpful',somewhat:'Somewhat helpful',not:'Not helpful'}};
async function get(format){if(!report.reportValidity())return;message.textContent='Loading…';results.replaceChildren();try{const r=await fetch('/api/survey?export='+format+'&month='+encodeURIComponent(month.value),{headers:{Authorization:'Bearer '+key.value},cache:'no-store'});if(!r.ok)throw new Error(r.status===401?'The reporting key was not accepted.':'Results are unavailable. Check the storage setup.');return r;}catch(e){message.textContent=e.message;}}
report.addEventListener('submit',async e=>{e.preventDefault();const r=await get('summary');if(!r)return;const data=await r.json();message.textContent='Completed surveys: '+data.total;for(const [question,counts]of Object.entries(data.counts)){const h=document.createElement('h2');h.textContent=labels[question];results.append(h);const table=document.createElement('table');const head=document.createElement('tr');for(const text of ['Answer','Responses','Percentage']){const th=document.createElement('th');th.textContent=text;head.append(th);}table.append(head);for(const [option,count]of Object.entries(counts)){const row=document.createElement('tr');for(const text of [options[question][option],count,data.total?(100*count/data.total).toFixed(1)+'%':'—']){const td=document.createElement('td');td.textContent=text;row.append(td);}table.append(row);}results.append(table);}});
document.getElementById('download').addEventListener('click',async()=>{const r=await get('csv');if(!r)return;const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download='survey-'+month.value+'.csv';a.click();URL.revokeObjectURL(url);message.textContent='CSV downloaded.';});
</script></body></html>
